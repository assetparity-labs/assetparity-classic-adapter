name: Decimal boundary checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: assetparity-labs/assetparity-classic-adapter
          path: assetparity-classic-adapter
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test assetparity-classic-adapter/test.mjs
